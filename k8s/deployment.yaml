
apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-app

  template:
    metadata:
      labels:
        app: devops-app

    spec:
      containers:
        - name: devops-container
          image: devops-project-7:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
